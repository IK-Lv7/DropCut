name: Windows build

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend build
        run: npm run build

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: Cache pinned local processing tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/tools
            src-tauri/resources/llm
            src-tauri/resources/licenses/generated
          key: windows-tools-${{ hashFiles('scripts/prepare-windows-tools.ps1') }}

      # The script pins every URL/checksum it fetches, so a cache hit means
      # the exact same files the script would have produced.
      - name: Prepare pinned local processing tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dropcut-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
