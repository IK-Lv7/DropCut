name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The app reports the version from these files, while latest.json uses the
  # tag. If they differ, the updater offers the same build forever.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches app version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          for value in "$conf" "$pkg" "$cargo"; do
            if [ "$value" != "$tag" ]; then
              echo "::error::Tag v$tag does not match app version (tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo). Bump the version before tagging."
              exit 1
            fi
          done

  build:
    needs: check-version
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: dropcut-windows-installer
          path: dist

      # The in-app updater (Tauri's `check()`) fetches this file to learn the
      # latest version, its signature, and where to download it.
      - name: Build updater manifest
        run: |
          set -euo pipefail
          exe=$(ls dist/*.exe)
          name=$(basename "$exe")
          version="${GITHUB_REF_NAME#v}"
          signature=$(cat "dist/${name}.sig")
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "$version" \
            --arg pub_date "$pub_date" \
            --arg signature "$signature" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}" \
            '{version: $version, notes: "See the GitHub release notes.", pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > dist/latest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.sig
            dist/latest.json
          generate_release_notes: true
