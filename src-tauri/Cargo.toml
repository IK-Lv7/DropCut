[package]
name = "dropcut"
version = "0.1.0"
description = "Free, private, local-first video editing"
authors = ["DropCut contributors"]
edition = "2021"

[lib]
name = "dropcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "process", "io-util", "time", "sync", "macros"] }
rustface = "0.1.7"
